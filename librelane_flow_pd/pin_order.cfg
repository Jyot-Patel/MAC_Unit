# Systolic pin order for mac_pe -- read by Odb.CustomIOPlacement
# (librelane/scripts/odbpy/io_place.py), NOT by the stock ioplacer.
#
# Format: side header (#N #S #E #W), then one regex per line. Each line is
# anchored as ^line$ and must match exactly one naming of a design port;
# ERRORS_ON_UNMATCHED_IO=both makes misses fatal. Order inside a section =
# order along that edge, low -> high coordinates:
#   #N / #S : left -> right   (increasing x)
#   #W / #E : bottom -> top   (increasing y)
#
# Sides follow docs/01_FLOORPLAN_GUIDE.md -- the systolic hop directions:
#   a flows WEST -> EAST     (a_in left edge, a_out right edge)
#   b flows NORTH -> SOUTH   (b_in top edge, b_out bottom edge)
#   psum reads out SOUTH     (the array's downward result flow)
#   controls join the NORTH input band (they are inputs, and they must not
#   eat space on the a-hop edges)
#
# Symmetry intent: WEST and EAST carry exactly the same 8 pins in the same
# order, so a_in[k] and a_out[k] land at the same y and the horizontal hop
# becomes a straight wire between abutted tiles. Verify after
# OpenROAD.IOPplacement by grepping the DEF (guide section 5).

#N
b_in.*
clk
rst_n
clear
acc_en

#S
b_out.*
psum_out.*

#W
a_in.*

#E
a_out.*
